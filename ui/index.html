<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XENO Uninstaller — Elite Software Manager</title>
  <link rel="stylesheet" href="/src/design/tailwind.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-obsidian-950 text-gray-100 flex flex-col h-screen w-screen overflow-hidden antialiased relative">
  
  <!-- 4. Dynamic Hardware-Accelerated Ambient Backdrop Glow -->
  <div id="ambient-backdrop" class="glow-native"></div>

  <!-- 3. CMD+K Spotlight Search Dim Overlay -->
  <div id="spotlight-dim-overlay"></div>

  <!-- Top Command Bar -->
  <header class="h-14 bg-obsidian-900/80 backdrop-blur-xl border-b border-white/[0.08] flex items-center justify-between px-6 z-20 shrink-0 relative">
    <!-- Left branding -->
    <div class="flex items-center gap-3.5">
      <button id="btn-toggle-sidebar" class="w-8 h-8 rounded-lg bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] flex items-center justify-center text-slate-400 hover:text-white transition-colors" title="Toggle Navigation (Ctrl+B)">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <div class="flex items-center gap-2">
        <span class="px-2 py-0.5 text-[10px] font-black tracking-wider bg-xeno-gold/15 text-xeno-gold border border-xeno-gold/30 rounded">XENO</span>
        <span class="text-xs font-bold tracking-widest text-slate-200">UNINSTALLER</span>
      </div>
    </div>

    <!-- 3. Spotlight Command Bar Interface -->
    <div class="flex-1 max-w-xl mx-6 z-30">
      <div class="relative flex items-center" id="search-container">
        <span class="absolute left-3.5 text-slate-400 pointer-events-none">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input 
          type="text" 
          id="global-search-input" 
          placeholder="Spotlight Command: Search apps, binaries, webapps, packages... (⌘K / Ctrl+F)"
          class="w-full h-10 bg-obsidian-850/90 border border-white/[0.1] focus:border-xeno-gold/60 focus:bg-obsidian-800 focus:shadow-glow-accent rounded-xl pl-10 pr-24 text-xs text-white placeholder-slate-400 outline-none transition-all duration-200"
        />
        <div class="absolute right-3 flex items-center gap-1.5 pointer-events-none">
          <kbd class="px-1.5 py-0.5 text-[10px] font-mono bg-white/[0.08] border border-white/[0.12] rounded text-slate-300 font-semibold shadow-sm">⌘</kbd>
          <kbd class="px-1.5 py-0.5 text-[10px] font-mono bg-white/[0.08] border border-white/[0.12] rounded text-slate-300 font-semibold shadow-sm">K</kbd>
        </div>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-2.5">
      <button id="btn-refresh" class="h-8 px-3.5 rounded-lg bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] flex items-center gap-1.5 text-xs font-medium text-slate-300 hover:text-white transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        <span>Refresh</span>
      </button>
      <button id="btn-toggle-inspector" class="h-8 px-3.5 rounded-lg bg-xeno-gold/10 hover:bg-xeno-gold/20 border border-xeno-gold/30 flex items-center gap-1.5 text-xs font-semibold text-xeno-gold transition-colors">
        <span>Inspector</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
      </button>
    </div>
  </header>

  <!-- 3-Column Dashboard Body -->
  <div class="flex flex-1 overflow-hidden relative z-10">
    
    <!-- 1. Collapsible Left Sidebar Navigation -->
    <aside id="sidebar-nav" class="w-64 bg-obsidian-900/70 backdrop-blur-2xl border-r border-white/[0.07] flex flex-col p-3.5 gap-4 shrink-0 transition-all duration-300">
      <div>
        <div class="px-2.5 mb-2 text-[10px] font-extrabold tracking-widest text-slate-500 uppercase">CATEGORIES</div>
        <nav class="flex flex-col gap-1" id="nav-categories-container">
          <!-- Dynamic navigation buttons -->
        </nav>
      </div>

      <div class="pt-2 border-t border-white/[0.06]">
        <div class="px-2.5 mb-2 text-[10px] font-extrabold tracking-widest text-slate-500 uppercase">PACKAGE SOURCES</div>
        <nav class="flex flex-col gap-1" id="nav-sources-container">
          <!-- Dynamic source buttons -->
        </nav>
      </div>

      <div class="mt-auto px-3 py-2.5 bg-white/[0.02] rounded-xl border border-white/[0.05] flex items-center justify-between text-[11px] text-slate-400">
        <span>Active Core</span>
        <span class="font-mono text-emerald-400 font-semibold flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
          CachyOS ALPM
        </span>
      </div>
    </aside>

    <!-- 2. Center Deck (Card Grid & Header Summary) -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <!-- Toolbar Summary -->
      <div class="h-11 px-7 bg-obsidian-900/30 backdrop-blur-md border-b border-white/[0.05] flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2.5">
          <span id="deck-view-title" class="text-xs font-bold text-white tracking-wide">All Software</span>
          <span class="text-slate-600">•</span>
          <span id="deck-view-count" class="text-xs text-slate-400">Showing 0 applications</span>
        </div>
        <div class="flex items-center gap-3">
          <label class="text-[11px] text-slate-400">Sort by:</label>
          <select id="sort-dropdown" class="bg-obsidian-850/80 border border-white/[0.08] text-slate-300 text-xs rounded-lg px-3 py-1 outline-none">
            <option value="name-asc">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
            <option value="source">Package Source</option>
            <option value="category">Category</option>
          </select>
        </div>
      </div>

      <!-- App Cards Grid Container -->
      <div class="flex-1 overflow-y-auto p-7">
        <div id="app-card-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
          <!-- Rendered modern cards -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col items-center justify-center h-80 text-slate-500 gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <p class="text-sm font-medium">No matching applications or packages found</p>
        </div>
      </div>
    </main>

    <!-- 3. Right Slide-out Forensic Sheet Panel -->
    <aside id="inspector-sheet" class="w-[420px] bg-obsidian-900/80 backdrop-blur-2xl border-l border-white/[0.08] flex flex-col shrink-0 shadow-2xl transition-all duration-300">
      <!-- Inspector Header -->
      <div class="h-14 px-6 bg-obsidian-850/70 border-b border-white/[0.08] flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2.5">
          <span class="w-2 h-2 rounded-full bg-xeno-gold animate-pulse shadow-sm shadow-xeno-gold"></span>
          <span class="text-xs font-extrabold tracking-widest text-slate-200 uppercase">FORENSIC TELEMETRY</span>
        </div>
        <button id="btn-close-sheet" class="w-7 h-7 rounded-lg hover:bg-white/[0.08] flex items-center justify-center text-slate-400 hover:text-white transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Inspector Content Body with Visual Gauges -->
      <div id="inspector-body" class="flex-1 overflow-y-auto p-6 space-y-6">
        <!-- Dynamic forensic details & visual telemetry charts -->
      </div>

      <!-- Inspector Action Footer -->
      <div class="p-5 bg-obsidian-850/90 border-t border-white/[0.08] shrink-0">
        <button id="btn-action-uninstall" class="w-full h-12 bg-rose-600 hover:bg-rose-500 disabled:bg-white/[0.04] disabled:text-slate-600 text-white font-bold text-xs rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-rose-950/50">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          <span id="uninstall-btn-label">Uninstall Application</span>
        </button>
      </div>
    </aside>
  </div>

  <!-- Modern Glassmorphic Uninstall Preview Modal -->
  <div id="uninstall-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden items-center justify-center p-4">
    <div class="w-full max-w-lg bg-obsidian-900/90 backdrop-blur-2xl border border-white/[0.12] rounded-2xl shadow-2xl overflow-hidden animate-fade-in">
      
      <!-- Modal Header -->
      <div class="px-6 py-4.5 bg-obsidian-850/80 border-b border-white/[0.08] flex items-center justify-between">
        <div>
          <span class="text-[10px] font-extrabold text-rose-400 bg-rose-500/10 px-2.5 py-1 rounded-full border border-rose-500/20 uppercase tracking-wider">CONFIRM UNINSTALLATION</span>
          <h3 id="modal-app-title" class="text-base font-bold text-white mt-1.5">Application Name</h3>
        </div>
        <button id="btn-close-modal" class="w-8 h-8 rounded-lg hover:bg-white/[0.08] text-slate-400 hover:text-white flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Modal Body Checklist -->
      <div id="modal-plan-content" class="p-6 space-y-4 text-xs">
        <!-- Checklist items rendered dynamically -->
      </div>

      <!-- Modal Footer Actions -->
      <div class="px-6 py-4 bg-obsidian-850/90 border-t border-white/[0.08] flex items-center justify-end gap-3">
        <button id="btn-modal-cancel" class="h-9 px-4.5 rounded-xl bg-white/[0.06] hover:bg-white/[0.1] text-slate-300 text-xs font-semibold transition-colors">Cancel</button>
        <button id="btn-modal-confirm" class="h-9 px-5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition-colors shadow-lg shadow-rose-950/50">Confirm & Execute</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
